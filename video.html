/* QUANTAREON — Light and Code */
:root {
  --bg: #0b0d10;
  --bg-soft: #11141a;

  --ink-faint: #66625a;

/* ---------- Light theme ---------- */
html[data-theme="light"] {
  --bg: #f7f4ec;
  --bg-soft: #efe9db;

  --ink-dim: #6d665a;

/* ---------- Starfield ---------- */

  position: absolute; border-radius: 50%;

/* ============================================================
   ЧИТАЕМОСТЬ — вариант C, обе темы
   Контраст считан по WCAG на фоне #f7f4ec (свет) и #0b0d10 (тьма)
   ============================================================ */

/* ---------- ТЁМНАЯ ---------- */
:root {
  --ink:       #fbf8f0;   /* было #e6e1d6  14.92:1 -> 18.33:1 */
  --ink-dim:   #c8c3b5;   /* было #9a958a   6.52:1 -> 11.05:1 */
  --ink-faint: #a09a8d;   /* было #66625a   3.21:1 ->  6.95:1  <- было слабо */
  --fire:      #e8bd6a;   /* было #c9993f   7.52:1 -> 11.04:1 */
  --line:      #43474f;   /* было #23262d — рамки не видно */
  --star:      #e9e2d0;
  --star-glow: rgba(233,226,208,.55);
  --nav-bg:    rgba(11,13,16,.94);
}
/* antialiased на тёмном ОСТАЁТСЯ: светлый текст на тёмном
   оптически разбухает, сглаживание его поджимает. Не трогаем. */
html:not([data-theme="light"]) body,
html:not([data-theme="light"]) .essay p,
html:not([data-theme="light"]) .page p,
html:not([data-theme="light"]) .page li,
html:not([data-theme="light"]) .card p,
html:not([data-theme="light"]) .ab-name,
html:not([data-theme="light"]) .essay p em,
html:not([data-theme="light"]) .page .lede,
html:not([data-theme="light"]) .quote,
html:not([data-theme="light"]) h3.chapter,
html:not([data-theme="light"]) .card .card-t { font-weight: 500; }

/* ---------- СВЕТЛАЯ ---------- */
html[data-theme="light"] {
  --bg:        #f7f4ec;
  --bg-soft:   #efe9db;
  --ink:       #0d0b07;   /* было #2b2720  13.51:1 -> 17.89:1 */
  --ink-dim:   #3a352c;   /* было #6d665a   5.17:1 -> 11.07:1 */
  --ink-faint: #565043;   /* было #9c9481   2.74:1 ->  7.28:1  <- было ПЛОХО */
  --fire:      #6f4a08;   /* было #a9741a   3.67:1 ->  7.19:1  <- было слабо */
  --line:      #b3a68a;   /* было #ddd5c4 — рамки не видно */
  --nav-bg:    rgba(247,244,236,.94);
  --star:      #a89a7a;
  --star-glow: rgba(168,154,122,.30);
  --star-opacity: .05;
}
/* ГЛАВНОЕ. antialiased утончает буквы. На тёмном фоне к месту,
   на светлом высасывает мясо из EB Garamond. Отсюда «заподлицо». */
html[data-theme="light"] body {
  -webkit-font-smoothing: auto;
  -moz-osx-font-smoothing: auto;
  text-rendering: optimizeLegibility;
}
html[data-theme="light"] body,
html[data-theme="light"] .essay p,
html[data-theme="light"] .page p,
html[data-theme="light"] .page li,
html[data-theme="light"] .card p,
html[data-theme="light"] .ab-name,
html[data-theme="light"] .card .card-t { font-weight: 600; }
html[data-theme="light"] .essay p em,
html[data-theme="light"] .page .lede,
html[data-theme="light"] .quote,
html[data-theme="light"] h3.chapter { font-weight: 500; }

/* ---------- ОБЕ ТЕМЫ ---------- */
/* Мелкий Inter в капсе с разрядкой рассыпается — 700 и разрядку убавить */
h2.section .section-label,
.page h2,
.page-kicker,
.ab-title,
.toc-section,
.nav-brand { font-weight: 700; letter-spacing: .2em; }
.nav-links a,
.toc-chapter,
.card .card-k,
.toc-title,
.ab-meta,
.footer { font-weight: 600; }
.footer a { color: var(--ink-dim); }
.quote { border-left-width: 3px; }
h2.section .section-label { border-top-width: 1.5px; border-bottom-width: 1.5px; }

/* Светлая: белое на белом */
html[data-theme="light"] .ab-row { border-top-color: rgba(0,0,0,.09); }
html[data-theme="light"] .ab-bar { background: rgba(0,0,0,.11); }
html[data-theme="light"] .ab-btn { border-color: rgba(111,74,8,.6); }
html[data-theme="light"] .ab-btn:hover { background: rgba(111,74,8,.12); }
html[data-theme="light"] .page a { border-bottom-color: rgba(111,74,8,.6); }

/* ---------- ЗОЛОТОЙ БРЕНД ---------- */
@keyframes qshine { 0% { background-position: 200% center; } 100% { background-position: -200% center; } }
.nav-brand, .qname, .astro-name {
  background: linear-gradient(100deg,
    #8a6212 0%, #b8862b 12%, #e8c464 26%, #fff6d5 38%,
    #ffe08a 46%, #fff6d5 52%, #e8c464 64%, #b8862b 80%, #8a6212 100%);
  background-size: 200% auto;
  -webkit-background-clip: text;
          background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: qshine 7s linear infinite;
}
/* На светлом фоне золото густое, иначе не прочтёшь:
   тёмный край 11.24:1, самый светлый блик 3.52:1 */
html[data-theme="light"] .nav-brand,
html[data-theme="light"] .qname,
html[data-theme="light"] .astro-name {
  background: linear-gradient(100deg,

  background-size: 200% auto;
  -webkit-background-clip: text;
          background-clip: text;
  -webkit-text-fill-color: transparent;
}
/* Старым браузерам без background-clip:text — просто золотой цвет */
@supports not ((-webkit-background-clip: text) or (background-clip: text)) {

}

/* ============================================================
   РУССКИЙ — GEORGIA
   Мэтью Картер, 1996. Кириллица у неё родная — рисовалась
   вместе с латиницей, не пришита сбоку.
   Стоит на всех устройствах. Качать нечего.
   ============================================================ */
body,
.essay p, .page p, .page li, .card p, .card .card-t,
.essay p em, .page .lede, .quote, h3.chapter,
.ab-name, h1, h2, h3, h4,
.essay, .page {
  font-family: Georgia, "Times New Roman", serif !important;
}
body, .essay p, .page p, .page li, .card p, .card .card-t, .ab-name,
.essay p em, .page .lede, .quote, h3.chapter {
  font-weight: 400 !important;
}
/* Кириллица у Georgia шире латиницы — кегль чуть меньше */
body { font-size: 17.5px !important; line-height: 1.78 !important; }
@media (max-width: 680px) {
  body { font-size: 16px !important; line-height: 1.75 !important; }
}

/* ============================================================
   ASTRO-FRACTAL — кнопка на движок
   Тот же шрифт, что у остальных. Только золотом.
   ============================================================ */
.astro-link {
  color: var(--fire) !important;
  white-space: nowrap;
}
.astro-link:hover { opacity: .78; }
@media (max-width: 680px) {
  /* 10px. Слова целые. ВСЁ ПРИБИТО НАМЕРТВО.
     Ничего не ездит, не болтается, не прокручивается. */
  .nav-links a {
    font-size: 10px !important;
    letter-spacing: .04em !important;
    white-space: nowrap !important;
    flex: 0 0 auto !important;
  }
  .nav-links {
    gap: 8px !important;
    flex-wrap: nowrap !important;
    justify-content: center !important;
    overflow: visible !important;
  }
  .nav { padding-left: 8px !important; padding-right: 8px !important; }
  .nav-right { gap: 6px; }
}
/* ============================================================
   ПРИБИВАЮ СТРАНИЦУ — ничего не ездит вбок
   ============================================================ */
html, body {
  overflow-x: hidden !important;
  max-width: 100% !important;
  position: relative;
}
* { max-width: 100%; }
img, video, svg, iframe, pre, table { max-width: 100% !important; height: auto; }

/* ============================================================
   НОВАЯ ШАПКА — книжечка-Меню + имя QUANTAREON + RU/EN + тема
   ============================================================ */
.topbar {
  position: sticky; top: 0; z-index: 50;
  display: flex; align-items: flex-end; justify-content: center;
  height: 80px; padding-bottom: 11px;
  background: var(--nav-bg); backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
  font-family: var(--sans);
}
/* книжечка-портал слева */
.book-wrap {
  position: absolute; left: 18px; bottom: 9px;
  display: flex; flex-direction: column; align-items: center;
  cursor: pointer; -webkit-tap-highlight-color: transparent;
}
.menu-hint {
  font-size: 13px; color: #e8384f; letter-spacing: 1px;
  margin-bottom: 2px; text-shadow: 0 0 8px rgba(232,56,79,.6);
  opacity: 0; animation: menuflash 8s ease-in-out infinite;
}
@keyframes menuflash { 0%,70%,100%{opacity:0} 80%,95%{opacity:1} }
.book { line-height: 0; transition: transform .5s ease; animation: bookbreathe 5s ease-in-out infinite; }
@keyframes bookbreathe { 0%,80%,100%{transform:scale(1)} 90%{transform:scale(1.14)} }
/* имя QUANTAREON по центру */
.qname-wrap {
  position: relative; display: flex; flex-direction: column; align-items: center;
}
.qname {
  position: relative; cursor: pointer; user-select: none;
  font-size: 22px; letter-spacing: 5px; font-weight: 600;
  -webkit-tap-highlight-color: transparent;
}
.talk-hint {
  position: absolute; bottom: 30px; white-space: nowrap;
  display: flex; flex-direction: column; align-items: center;
  opacity: 0; animation: talkflash 10s ease-in-out infinite;
}
@keyframes talkflash { 0%,70%,100%{opacity:0} 80%,95%{opacity:1} }
.talk-hint .txt { font-size: 13px; color: #e8384f; text-shadow: 0 0 6px rgba(232,56,79,.6); }
.talk-hint .arr { line-height: 0; margin-top: 1px; filter: drop-shadow(0 0 5px rgba(232,56,79,.6)); animation: arrbounce 1s infinite; }
@keyframes arrbounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(3px)} }
/* пульсирующие круги при активации голоса */
.qname .ring {
  position: absolute; left: 50%; top: 50%; width: 20px; height: 20px;
  border: 1.5px solid var(--fire); border-radius: 50%;
  transform: translate(-50%,-50%); opacity: 0; pointer-events: none;
}
/* медленное растекание волн — 4.2 сек на круг, три волны вдогонку */
.qname.active .ring { animation: qpulse 4.2s cubic-bezier(.22,.61,.36,1) infinite; }
.qname.active .ring:nth-child(2) { animation-delay: 1.4s; }
.qname.active .ring:nth-child(3) { animation-delay: 2.8s; }
@keyframes qpulse {
  0%   { width: 26px; height: 22px; opacity: .85; border-color: rgba(232,56,79,.8); }
  35%  { border-color: rgba(232,56,79,.45); }
  100% { width: 260px; height: 110px; opacity: 0; border-color: var(--fire); }
}
/* красное сердце: тихо тлеет за именем, пока голос активен */
.qname.active::before {
  content: ''; position: absolute; left: 50%; top: 50%;
  width: 132px; height: 46px; transform: translate(-50%,-50%);
  border-radius: 50%; pointer-events: none; z-index: -1;
  background: radial-gradient(ellipse at center,
    rgba(232,56,79,.55) 0%, rgba(232,56,79,.22) 45%, rgba(232,56,79,0) 72%);
  animation: qheart 4.2s ease-in-out infinite;
}
@keyframes qheart {
  0%,100% { opacity: .45; transform: translate(-50%,-50%) scale(.92); }
  50%     { opacity: 1;   transform: translate(-50%,-50%) scale(1.08); }
}
@media (max-width: 680px) {
  @keyframes qpulse {
    0%   { width: 22px; height: 18px; opacity: .85; border-color: rgba(232,56,79,.8); }
    100% { width: 190px; height: 84px; opacity: 0; border-color: var(--fire); }
  }
  .qname.active::before { width: 104px; height: 38px; }
}

/* ================== ОКНО РАЗГОВОРА (справа от заставки) ================== */
.vchat {
  position: absolute; top: 0; bottom: 0; right: 2.2vw;
  width: clamp(240px, 24vw, 360px);
  display: none; flex-direction: column;
  background: rgba(10,12,16,.72);
  border: 1px solid rgba(212,175,90,.22); border-radius: 14px;
  overflow: hidden; backdrop-filter: blur(6px); z-index: 40;
}
.vchat.open { display: flex; }
.vchat-head {
  flex: none; display: flex; align-items: center; justify-content: space-between;
  padding: .55rem .8rem; border-bottom: 1px solid rgba(212,175,90,.18);
  font-family: var(--sans); font-size: .68rem; letter-spacing: .18em;
  text-transform: uppercase; color: var(--fire);
}
.vchat-close {
  background: none; border: 0; color: var(--ink-dim); font-size: 1rem;
  line-height: 1; cursor: pointer; padding: 0 .1rem; transition: color .2s;
}
.vchat-close:hover { color: var(--fire); }
.vchat-body {
  flex: 1 1 auto; overflow-y: auto; padding: .8rem;
  display: flex; flex-direction: column; gap: .55rem;
  scrollbar-width: thin; scrollbar-color: rgba(212,175,90,.35) transparent;
}
.vchat-body::-webkit-scrollbar { width: 5px; }
.vchat-body::-webkit-scrollbar-thumb { background: rgba(212,175,90,.35); border-radius: 3px; }
.vmsg {
  font-family: var(--sans); font-size: .82rem; line-height: 1.45;
  padding: .5rem .7rem; border-radius: 11px; max-width: 92%;
  word-wrap: break-word; animation: vfade .35s ease-out;
}
.vmsg.me { align-self: flex-end; background: rgba(212,175,90,.14); color: var(--ink); }
.vmsg.him { align-self: flex-start; background: rgba(255,255,255,.055); color: var(--ink); }
.vmsg .who {
  display: block; font-size: .58rem; letter-spacing: .16em; text-transform: uppercase;
  color: var(--ink-dim); margin-bottom: .22rem;
}
.vmsg.him .who { color: var(--fire); }
@keyframes vfade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.vchat-empty { color: var(--ink-dim); font-family: var(--sans); font-size: .78rem; text-align: center; margin: auto 0; opacity: .75; }
html[data-theme="light"] .vchat { background: rgba(252,250,245,.86); }
html[data-theme="light"] .vmsg.him { background: rgba(0,0,0,.05); }
/* на узких экранах места справа нет — окно уходит под заставку */
@media (max-width: 900px) {
  .vchat {
    position: static; flex: 1 0 100%; width: auto;
    margin: .9rem 3vw 0; box-sizing: border-box; max-width: calc(100% - 6vw);
    height: 46vh; right: auto; border-radius: 12px;
  }
  .hero { flex-wrap: wrap; }
}
/* всплывашка статуса голоса */
.qtoast {
  position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(12px);
  background: rgba(12,14,18,.92); color: var(--ink);
  border: 1px solid rgba(212,175,90,.35); border-radius: 999px;
  padding: .6rem 1.15rem; font-family: var(--sans); font-size: .85rem;
  letter-spacing: .02em; z-index: 300; opacity: 0; pointer-events: none;
  transition: opacity .25s, transform .25s; max-width: 88vw; text-align: center;
}
.qtoast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.qtoast.bad { border-color: rgba(232,56,79,.55); color: #ffb3bd; }
html[data-theme="light"] .qtoast { background: rgba(252,250,245,.95); color: #2a2a2a; }
@keyframes qvibe { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-1px)} 75%{transform:translateX(1px)} }
/* правый угол: RU/EN + тема */
.topbar-right {
  position: absolute; right: 22px; bottom: 9px;
  display: flex; align-items: center; gap: 14px;
}
.lang-link { color: var(--ink-dim); text-decoration: none; font-size: .78rem; letter-spacing: .14em; text-transform: uppercase; transition: color .25s; }
.lang-link:hover { color: var(--fire); }
.topbar .theme-toggle {
  flex: 0 0 auto; width: 2rem; height: 2rem; border-radius: 50%;
  border: 1px solid var(--line); background: transparent; color: var(--ink-dim);
  font-size: .9rem; line-height: 1; cursor: pointer; padding: 0;
  display: flex; align-items: center; justify-content: center;
  transition: color .25s, border-color .25s;
  -webkit-tap-highlight-color: transparent;
}
.topbar .theme-toggle:hover { color: var(--fire); border-color: var(--fire); }
@media (max-width: 680px) {
  .qname { font-size: 18px; letter-spacing: 3px; }
  .book svg { width: 36px; height: 36px; }
  .topbar-right { gap: 10px; right: 14px; }
  .book-wrap { left: 12px; }
}

/* ---------- Боковое меню-баян ---------- */
.drawer {
  position: fixed; top: 0; left: 0; bottom: 0; width: 260px; z-index: 60;
  background: var(--bg-soft); border-right: 1px solid var(--line);
  transform: translateX(-100%); transition: transform .35s ease;

}
.drawer.open { transform: translateX(0); }
.drawer .title { padding: 0 24px 12px; color: var(--fire); font-size: 11px; letter-spacing: 2px; text-transform: uppercase; border-bottom: 1px solid var(--line); }
.mrow { display: block; padding: 13px 24px; color: var(--ink); font-size: 14px; text-decoration: none; border-bottom: 1px solid rgba(201,153,63,.08); cursor: pointer; transition: background .2s; }

     На экране её не видно, странице она не мешает. Сообщает только:
     какую страницу открыли, откуда пришли. Город и оператора сервер
     берёт сам — адрес посетителя нигде не хранится.

     ═══ 🔑 СКРЫТЫЙ ПУНКТ «СТАТИСТИКА» ═══
     Виден ТОЛЬКО хозяину. Один раз открываешь сайт с ?admin=КЛЮЧ —
     браузер запоминает, и дальше пункт всегда на месте. У посетителей
     его нет вовсе: ни в разметке, ни в глаза. -->
<script>
(function () {
  // ── считаем заход ──
  try {
    var т = new Image(1, 1);
    т.src = "https://voice.quantareon.com/api/hit"
          + "?p=" + encodeURIComponent(location.pathname)
          + "&r=" + encodeURIComponent(document.referrer || "")
          + "&_=" + Date.now();
  } catch (e) {}

  // ── скрытый вход для хозяина ──
  var ПАМЯТЬ = "qn_admin";
  try {
    var изАдреса = new URLSearchParams(location.search).get("admin");
    if (изАдреса) {
      localStorage.setItem(ПАМЯТЬ, изАдреса);
      // убираем ключ из адресной строки, чтобы не светился
      history.replaceState(null, "", location.pathname + location.hash);
    }
    var ключ = localStorage.getItem(ПАМЯТЬ);
    if (!ключ) return;

    var меню = document.getElementById("drawer");
    if (!меню || меню.querySelector(".mrow-stats")) return;

    var строка = document.createElement("a");
    строка.className = "mrow mrow-stats";
    строка.href = "https://voice.quantareon.com/stats?key=" + encodeURIComponent(ключ);
    строка.target = "_blank";
    строка.rel = "noopener";
    строка.innerHTML = 'Stats<span class="ext">↗</span>';
    строка.style.opacity = ".72";
    строка.style.fontSize = ".9em";
    меню.appendChild(строка);
  } catch (e) {}
})();
</script>

</body>
</html>
