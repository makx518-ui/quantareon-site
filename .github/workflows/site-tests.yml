name: Проверки сайта

# Гоняем при каждой заливке в main и раз в сутки — на случай, если
# что-то отвалилось само: истёк ключ, лёг файл, слетела разметка.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"      # каждый день в 6 утра по Гринвичу
  workflow_dispatch:          # и вручную, кнопкой

jobs:
  files:
    name: Файлы в репозитории
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Проверить файлы, не дожидаясь публикации
        run: python3 tests/test_site.py --local .

  live-site:
    name: Живой сайт
    runs-on: ubuntu-latest
    # ждём, пока GitHub Pages опубликует изменения
    needs: files
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ⏳ GitHub Pages публикует не мгновенно, а иногда и пару минут.
      # Поэтому не ждём вслепую, а пробуем несколько раз: как только
      # сайт отзовётся — идём дальше.
      - name: Дождаться публикации
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -sf -o /dev/null --max-time 20 https://quantareon.com/; then
              echo "сайт отвечает (попытка $i)"
              sleep 20   # дать разойтись по краям сети
              exit 0
            fi
            echo "жду публикации… (попытка $i)"
            sleep 30
          done
          echo "сайт так и не отозвался"
          exit 1

      - name: Проверить живой сайт
        run: python3 tests/test_site.py
